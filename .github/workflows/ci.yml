name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: test (race)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: assets
        run: go run ./tools/genassets -out dist/assets
      - name: build
        run: go build ./cmd/autoportal
      # A ready-to-try macOS app for every pull request (Actions → run → Artifacts).
      - name: package macOS app
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        run: sh scripts/package-macos.sh v0.0.0-pr${{ github.event.number }}
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        with:
          name: autoportal-macos-test
          path: dist/autoportal-macos.zip
